name: Translate Tournament sets

on:
  workflow_dispatch:
    inputs:
      max_new_calls:
        description: Maximum paid OpenRouter requests for this run
        required: true
        default: '0'
        type: string
      demo_only:
        description: Process only the four required 2009 sets
        required: true
        default: true
        type: boolean

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/
            output/
          key: tournament-v2-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: tournament-v2-${{ github.ref_name }}-
      - run: python archive.py
      - name: Extract and translate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_NEW_CALLS: ${{ inputs.max_new_calls }}
          DEMO_ONLY: ${{ inputs.demo_only && '1' || '0' }}
        run: python extractor.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/
            output/
          key: tournament-v2-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tournament-results
          path: |
            data/archive.sqlite
            data/raw/
            output/
